[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "team-status"
version = "0.1.0"
description = "Git-backed effort tracking and weekly team status"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "PyYAML>=6.0.2,<7", "markdown-it-py>=3,<5", "Jinja2>=3.1.6,<4", "MarkupSafe>=2.1,<4"]

[project.scripts]
team-status = "team_status.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "pyright>=1.1",
    "deptry>=0.25.1",
    "covdefaults>=2.3.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "ty>=0.0.49",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (CLI, filesystem)",
]
addopts = "--cov=team_status --cov-report=term-missing -n 4"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/team_status"]

[tool.deptry]
known_first_party = ["team_status"]

[tool.coverage.run]
plugins = ["covdefaults"]
omit = ["tests/**"]

[tool.coverage.report]
fail_under = 90
omit = ["tests/**"]