include:
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      stage: check
      disabled_resolution_jobs: maven,gradle,python

stages: [check, report, render, deploy]

default:
  image: ghcr.io/astral-sh/uv:0.12.5-python3.12-bookworm-slim
  before_script:
    - UV_TOOL_BIN_DIR=/usr/local/bin uv tool install go-task-bin==3.51.1
    - task python:setup
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache/]

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  UV_LOCKED: 'true'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

audit:
  stage: check
  script:
    - task audit -- --output-format=json > audit.json
  artifacts:
    when: always
    paths: [audit.json]
    expire_in: 90 days

# The GitLab analyzer supplies native dependency_scanning and CycloneDX
# reports for vulnerability and license displays. It has its own runtime.
dependency-scanning:
  before_script: []
  cache: []
  artifacts:
    when: always
    expire_in: 90 days

lint:
  stage: check
  script:
    - task lint -- --output-format=gitlab --output-file=gl-lint.json
  artifacts:
    when: always
    paths: [gl-lint.json]
    reports:
      codequality: gl-lint.json
    expire_in: 90 days

format:
  stage: check
  script:
    - task format -- --check --output-format=gitlab > gl-format.json
  artifacts:
    when: always
    paths: [gl-format.json]
    reports:
      codequality: gl-format.json
    expire_in: 90 days

type:
  stage: check
  script:
    - task type -- --output-format=gitlab > gl-type.json
  artifacts:
    when: always
    paths: [gl-type.json]
    reports:
      codequality: gl-type.json
    expire_in: 90 days

build:
  stage: check
  script:
    - task build
  artifacts:
    paths: [dist/]
    expire_in: 90 days

test:
  stage: check
  script:
    - task test:report
  coverage: '/TOTAL\s+.*\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    paths: [test_out/]
    reports:
      junit: test_out/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: test_out/coverage.xml
    expire_in: 90 days

validate:
  stage: check
  script:
    - task validate
    - task schema
    - git diff --exit-code -- schema/

weekly-report:
  stage: report
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - task build-week
  artifacts:
    name: 'weekly-status-$CI_COMMIT_SHORT_SHA'
    paths: [build/]
    expire_in: 90 days

weekly-slides:
  stage: render
  image:
    name: ghcr.io/marp-team/marp-cli:v4.5.1
    entrypoint: [""]
  before_script:
    - npm install --global @go-task/cli@3.51.1
    - export MARP_USER="$(id -u):$(id -g)"
  cache: []
  needs:
    - job: weekly-report
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    MARP_CMD: docker-entrypoint
  script:
    - task slides:html -- build/*/slides.md
    - task slides:ppt -- build/*/slides.md
    - task slides:pdf -- build/*/slides.md
  artifacts:
    name: 'weekly-reports-$CI_COMMIT_SHORT_SHA'
    paths: [build/]
    expire_in: 90 days

pages:
  stage: deploy
  needs:
    - job: weekly-slides
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -eu
      set -- build/*/slides.html
      test "$#" -eq 1
      test -s "$1"
      cp -R "$(dirname "$1")" public
      cp "$1" public/index.html
  pages:
    publish: public
  artifacts:
    paths: [public/]
    expire_in: 90 days

weekly-email:
  stage: deploy
  needs:
    - job: weekly-report
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  retry: 0
  script:
    - task email:send
