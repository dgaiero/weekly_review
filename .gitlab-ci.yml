stages: [check, report, render]

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  before_script:
    - UV_TOOL_BIN_DIR=/usr/local/bin uv tool install go-task-bin==3.51.1
    - task setup
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache/]

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

check:
  stage: check
  script:
    - task ci:check

weekly-report:
  stage: report
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - task build
  artifacts:
    name: 'weekly-status-$CI_COMMIT_SHORT_SHA'
    paths: [build/]
    expire_in: 90 days

weekly-powerpoint:
  stage: render
  image:
    name: ghcr.io/marp-team/marp-cli:v4.5.1
    entrypoint: [""]
  before_script:
    - npm install --global @go-task/cli@3.51.1
  cache: []
  needs:
    - job: weekly-report
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - task slides:pptx:ci
  artifacts:
    name: 'weekly-reports-$CI_COMMIT_SHORT_SHA'
    paths: [build/]
    expire_in: 90 days
