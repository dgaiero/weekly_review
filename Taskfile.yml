version: '3'

env:
  UV_CACHE_DIR: '{{.ROOT_DIR}}/.uv-cache'

tasks:
  default:
    cmds: [task --list]
    # Dev Environment

  audit:
    desc: Run security audit and dependency checks
    cmds:
      - uv audit --preview-features audit-command
      - uv run deptry src

  lint:
    desc: Run linting checks
    aliases:
      - check
    cmds:
      - uv run ruff check --fix {{.CLI_ARGS}}

  format:
    desc: Run code formatter
    cmds:
      - uv run ruff format {{.CLI_ARGS}}

  type:
    desc: Run type checking
    cmds:
      - uv run ty check {{.CLI_ARGS}}

  build:
    desc: Build the project
    cmds:
      - uv build {{.CLI_ARGS}}

  test:
    desc: Run tests with coverage
    cmds:
      - uv run pytest {{.CLI_ARGS}}
    aliases:
      - test:all

  test:report:
    desc: Run tests with coverage
    cmds:
      - uv run pytest --html=./test_out/report.html --cov-report html {{.CLI_ARGS}}

  all_checks:
    desc: Run all checks (audit, lint, format, type)
    cmds:
      - task: audit
      - task: lint
      - task: format
      - task: type


  setup:
    desc: Install the locked Python environment
    cmds: [uv sync --locked]
  # Code Quality
  # Tool Use
  demo:
    desc: Build the fictional example week and export PowerPoint outside the live portfolio
    cmds:
      - uv run --locked team-status build-week --root examples --week 2026-09-21 --output examples/build/demo
      - task: slides:pptx
        vars:
          CLI_ARGS: examples/build/demo/2026-09-21/slides.md
      - task: slides:pdf
        vars:
          CLI_ARGS: examples/build/demo/2026-09-21/slides.md
      - task: slides:html
        vars:
          CLI_ARGS: examples/build/demo/2026-09-21/slides.md
  validate:
    desc: Validate the portfolio (optional -- --week YYYY-MM-DD)
    cmds: ['uv run --locked team-status validate {{.CLI_ARGS}}']
  build-week:
    desc: Build JSON, slide Markdown, email Markdown and HTML (optional -- --week YYYY-MM-DD)
    cmds: ['uv run --locked team-status build-week {{.CLI_ARGS}}']
  schema:
    desc: Export JSON schemas from the Pydantic contracts
    cmds: [uv run --locked team-status schema]
  check:
    desc: Run lint, tests, and portfolio validation
    cmds:
      - task: lint
      - task: test
      - task: validate
  slides:setup:
    desc: Install pinned Marp tools (requires Node 22+ and pnpm)
    cmds: [pnpm install --frozen-lockfile]
  slides:pptx:
    desc: Export slide Markdown to PowerPoint (task pptx -- build/2026-09-21/slides.md)
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: Pass a slides.md path after --
    cmds: ['pnpm exec marp --pptx {{.CLI_ARGS}}']
  slides:html:
    desc: Preview slides as HTML (task slides:html -- build/2026-09-21/slides.md)
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: Pass a slides.md path after --
    cmds: ['pnpm exec marp {{.CLI_ARGS}}']
  slides:pdf:
    desc: Export slide Markdown to PDF (task slides:pdf -- build/2026-09-21/slides.md)
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: Pass a slides.md path after --
    cmds: ['pnpm exec marp --pdf {{.CLI_ARGS}}']
  # CI Commands
  ci:check:
    desc: Run all checks and verify generated schemas are committed
    cmds:
      - task: check
      - task: schema
      - git diff --exit-code -- schema/
  slides:pptx:ci:
    desc: Export built reports inside the official Marp container
    cmds:
      - mkdir -p /home/marp/app/reports
      - cp -R build/. /home/marp/app/reports/
      - chown -R marp:marp /home/marp/app/reports
      - docker-entrypoint --pptx /home/marp/app/reports/*/slides.md
      - cp -R /home/marp/app/reports/. build/
