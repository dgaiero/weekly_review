version: '3'

env:
  UV_CACHE_DIR: '{{.ROOT_DIR}}/.uv-cache'

tasks:
  default:
    cmds: [task --list]
  setup:
    desc: Install the locked Python environment
    cmds: [uv sync --locked]
  test:
    desc: Run the test suite
    cmds: [uv run --locked pytest]
  lint:
    desc: Check Python style and formatting
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .
  format:
    desc: Format Python sources
    cmds: [uv run --locked ruff format .]
  validate:
    desc: Validate the portfolio (optional -- --week YYYY-Www)
    cmds: ['uv run --locked team-status validate {{.CLI_ARGS}}']
  build:
    desc: Build JSON, slide Markdown, email Markdown and HTML (optional -- --week YYYY-Www)
    cmds: ['uv run --locked team-status build-week {{.CLI_ARGS}}']
  schema:
    desc: Export JSON schemas from the Pydantic contracts
    cmds: [uv run --locked team-status schema]
  check:
    desc: Run lint, tests, and portfolio validation
    cmds:
      - task: lint
      - task: test
      - task: validate
  ci:check:
    desc: Run all checks and verify generated schemas are committed
    cmds:
      - task: check
      - task: schema
      - git diff --exit-code -- schema/
  demo:
    desc: Build the fictional example week and export PowerPoint outside the live portfolio
    cmds:
      - uv run --locked team-status build-week --root examples --week 2026-W39 --output examples/build/demo
      - task: slides:pptx
        vars:
          CLI_ARGS: examples/build/demo/2026-W39/slides.md
      - task: slides:pdf
        vars:
          CLI_ARGS: examples/build/demo/2026-W39/slides.md
  slides:setup:
    desc: Install pinned Marp tools (requires Node 22+ and pnpm)
    cmds: [pnpm install --frozen-lockfile]
  slides:pptx:
    desc: Export slide Markdown to PowerPoint (task pptx -- build/2026-W39/slides.md)
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: Pass a slides.md path after --
    cmds: ['pnpm exec marp --pptx {{.CLI_ARGS}}']
  slides:pptx:ci:
    desc: Export built reports inside the official Marp container
    cmds:
      - mkdir -p /home/marp/app/reports
      - cp -R build/. /home/marp/app/reports/
      - chown -R marp:marp /home/marp/app/reports
      - docker-entrypoint --pptx /home/marp/app/reports/*/slides.md
      - cp -R /home/marp/app/reports/. build/
  slides:html:
    desc: Preview slides as HTML (task slides:html -- build/2026-W39/slides.md)
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: Pass a slides.md path after --
    cmds: ['pnpm exec marp {{.CLI_ARGS}}']
  slides:pdf:
    desc: Export slide Markdown to PDF (task slides:pdf -- build/2026-W39/slides.md)
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: Pass a slides.md path after --
    cmds: ['pnpm exec marp --pdf {{.CLI_ARGS}}']
